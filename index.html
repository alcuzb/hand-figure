<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SnapPuzzle</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>SnapPuzzle</h1>
  <div class="lang"><button data-lang="uz">UZ</button><button data-lang="en">EN</button></div>
</header>
<main>
  <div class="stage"><canvas id="stage" width="1280" height="720"></canvas><video id="cam" playsinline muted hidden></video></div>
  <p id="hint" role="status"></p>
  <section>
    <div id="album"></div>
    <button id="dl" disabled data-i18n="download"></button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
